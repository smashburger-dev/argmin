name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - run: npm run build:release
      - run: npm test
      - run: npm run test:project-runner
      - run: npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Frischer Vertragsbeleg ueberspringt den Pyodide-Browser-Run; der
      # Cache-Key deckt alle Eingaben ab, die den runtimeHash beeinflussen.
      - uses: actions/cache@v4
        with:
          path: tests/e2e/pyodide-contract-receipt.json
          key: pyodide-contract-${{ hashFiles('content/**', 'assets/js/**', 'vendor/pyodide/**', 'tools/pyodide_contract_matrix.mjs', 'tools/compile_content.mjs', 'tools/build_coverage_matrix.mjs') }}
      - run: npm run test:e2e -- --project=chromium
      - run: npm run test:e2e:build
