name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # A normal run takes about one minute; the GitHub default would be six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails within seconds when a derived artifact was not regenerated,
      # and names the command that fixes it.
      - run: npm run check:derived
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build:release
      - run: npm test
      - run: npm run test:project-runner
      - run: npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    # A normal run takes about three minutes; the GitHub default would be six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # No --with-deps: ubuntu-latest already ships Chromium's shared libraries,
      # and the extra apt fonts/upgrades stalled for minutes on slow runner mirrors.
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      # Frischer Vertragsbeleg ueberspringt den Pyodide-Browser-Run; der
      # Cache-Key deckt alle Eingaben ab, die den runtimeHash beeinflussen.
      - uses: actions/cache@v4
        with:
          path: tests/e2e/pyodide-contract-receipt.json
          key: pyodide-contract-${{ hashFiles('content/**', 'assets/js/**', 'vendor/pyodide/**', 'tools/pyodide_contract_matrix.mjs', 'tools/compile_content.mjs', 'tools/build_coverage_matrix.mjs') }}
      - run: npm run test:e2e -- --project=chromium
      - run: npm run test:e2e:build
