name: Graphify main graph

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graphify-main
  cancel-in-progress: true

env:
  GRAPHIFY_NO_AUTO_REFRESH: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned Graphify
        run: python -m pip install 'graphifyy==0.9.76'
      - name: Build, validate and publish a code-only graph
        run: python .github/graphify_ci.py
